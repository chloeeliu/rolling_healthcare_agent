hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - pkg://verl.trainer.config
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.searchpath=[pkg://verl.trainer.config]
    - hydra.mode=RUN
    task:
    - data.train_files=/tmp/verl_sepsis_core_parquet_smoke2/train.parquet
    - data.val_files=/tmp/verl_sepsis_core_parquet_smoke2/val.parquet
    - data.train_max_samples=1
    - data.val_max_samples=1
    - data.train_batch_size=1
    - data.val_batch_size=1
    - data.max_prompt_length=4096
    - actor_rollout_ref.model.path=/home/chloeliu/.cache/huggingface/hub/models--Qwen--Qwen3-1.7B/snapshots/70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    - actor_rollout_ref.actor.ppo_mini_batch_size=1
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.n=1
    - actor_rollout_ref.rollout.response_length=64
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.25
    - trainer.default_local_dir=/tmp/verl_smoke_ckpt
    - trainer.total_epochs=1
    - trainer.val_before_train=false
    - trainer.test_freq=-1
    - trainer.save_freq=-1
    - trainer.logger=[console]
  job:
    name: main_ppo
    chdir: null
    override_dirname: actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=1,actor_rollout_ref.model.path=/home/chloeliu/.cache/huggingface/hub/models--Qwen--Qwen3-1.7B/snapshots/70d244cc86ccca08cf5af4e1e306ecf908b1ad5e,actor_rollout_ref.rollout.gpu_memory_utilization=0.25,actor_rollout_ref.rollout.n=1,actor_rollout_ref.rollout.response_length=64,data.max_prompt_length=4096,data.train_batch_size=1,data.train_files=/tmp/verl_sepsis_core_parquet_smoke2/train.parquet,data.train_max_samples=1,data.val_batch_size=1,data.val_files=/tmp/verl_sepsis_core_parquet_smoke2/val.parquet,data.val_max_samples=1,trainer.default_local_dir=/tmp/verl_smoke_ckpt,trainer.logger=[console],trainer.save_freq=-1,trainer.test_freq=-1,trainer.total_epochs=1,trainer.val_before_train=false
    id: ???
    num: ???
    config_name: sepsis_core_grpo_qwen4b_a100
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/chloeliu/rolling_healthcare_agent
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/chloeliu/rolling_healthcare_agent/configs/verl
      schema: file
      provider: main
    - path: verl.trainer.config
      schema: pkg
      provider: hydra.searchpath in command-line
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/chloeliu/rolling_healthcare_agent/outputs/2026-04-30/23-41-52
    choices:
      algorithm@algorithm.rollout_correction: rollout_correction
      reward: reward
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      data: legacy_data
      model_engine: dp
      critic: dp_critic
      critic/../engine@critic.model.fsdp_config: fsdp
      critic/../optim@critic.optim: fsdp
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
